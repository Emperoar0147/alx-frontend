<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="03-styles.css">
    <title>Responsive Images</title>
</head>
<body>
    <section class="about">
        <img
          sizes="(max-width: 3000px) 40vw, 1200px"
          srcset="
            images/pic-about-01_w_380.jpg 380w,
            images/pic-about-01_w_853.jpg 853w,
            images/pic-about-01_w_1200.jpg 1200w"
          src="images/pic-about-01_w_1200.jpg"
          alt="About Us Image">
    </section>

    <section class="articles">
        <img
          sizes="(max-width: 3000px) 40vw, 1200px"
          srcset="
            images/pic-article-01_w_380.jpg 380w,
            images/pic-article-01_w_853.jpg 853w,
            images/pic-article-01_w_1200.jpg 1200w"
          src="images/pic-article-01_w_1200.jpg"
          alt="Article Image 1">

        <img
          sizes="(max-width: 3000px) 40vw, 1200px"
          srcset="
            images/pic-article-02_w_380.jpg 380w,
            images/pic-article-02_w_853.jpg 853w,
            images/pic-article-02_w_1200.jpg 1200w"
          src="images/pic-article-02_w_1200.jpg"
          alt="Article Image 2">

        <img
          sizes="(max-width: 3000px) 40vw, 1200px"
          srcset="
            images/pic-article-03_w_380.jpg 380w,
            images/pic-article-03_w_853.jpg 853w,
            images/pic-article-03_w_1200.jpg 1200w"
          src="images/pic-article-03_w_1200.jpg"
          alt="Article Image 3">
    </section>
</body>
</html>
